name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to the local dev toolchain — 'stable' drifts (1.7.1 broke fmt --check
          # with formatter rules 1.4.3 disagrees with).
          version: v1.4.3

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      # EIP-170 size limits are enforced by test/unit/ContractSizeTest.t.sol (production
      # contracts only) instead of --sizes, whose gate also covers test-only harnesses.
      - name: Run Forge build
        run: |
          forge build
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
