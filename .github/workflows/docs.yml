name: Deploy docs

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep in step with the version used locally: the sidebar, the theme
      # picker's markup, and the asset filenames all changed across the 0.4/0.5
      # boundary, so a mismatch ships a site that differs from what was reviewed.
      MDBOOK_VERSION: v0.5.4
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build book
        run: mdbook build docs

      # mdBook copies no .md files into the book, so each chapter's source is
      # published beside its HTML here; the page actions (page-actions.js) copy
      # it to the clipboard and point ChatGPT and Claude at it. index.html is the
      # first chapter rendered again under the source name index.md, so the
      # first chapter SUMMARY.md links is published under that name too.
      - name: Publish Markdown sources
        working-directory: docs/src
        run: |
          find . -name '*.md' ! -name SUMMARY.md -exec cp --parents {} ../book/ \;
          first=$(sed -n 's/.*](\([^)]*\.md\)).*/\1/p' SUMMARY.md | head -n 1)
          cp "$first" ../book/index.md

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
