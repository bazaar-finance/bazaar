[book]
title = "Bazaar Protocol"
description = "Permissionless perpetual futures on anything with a price feed"
language = "en"
src = "src"

[output.html]
# "ayu" is mdBook's internal id for the theme the picker labels Liberty.
default-theme = "ayu"
preferred-dark-theme = "ayu"
additional-css = ["bazaar-theme.css"]
additional-js = ["bazaar-theme.js"]
no-section-label = true
fold = { enable = true, level = 1 }
