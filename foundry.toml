[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 220
solc_version = "0.8.34"
evm_version = "cancun"
remappings = [
    "@pythnetwork/pyth-sdk-solidity/=node_modules/@pythnetwork/pyth-sdk-solidity",
    "@openzeppelin/=lib/openzeppelin-contracts/",
]

# MatchingEngineLib overflows EIP-170 by 30B at the global 220 runs (24,606 > 24,576).
# Compile it at 200 runs instead → 24,472B (+104 margin). NOTE: this is not surgical to
# the library — because BazaarPair imports it (external-library call) and BazaarFactory
# imports BazaarPair, solc compiles the whole chain in one unit, so all three land at 200
# runs. At 200 the cost is negligible: BazaarFactory is byte-identical to its 220 build and
# BazaarPair moves 43B with gas essentially unchanged (200 vs 220 is the flat top of the
# size/gas curve). Drop to 150 to also de-fragilize BazaarPair's margin (24,330, +246) at a
# modestly broader gas cost. Every other deployed contract stays at 220.
[[profile.default.additional_compiler_profiles]]
name = "me-small"
via_ir = true
optimizer = true
optimizer_runs = 200

[[profile.default.compilation_restrictions]]
paths = "src/libraries/MatchingEngineLib.sol"
optimizer_runs = 200

[invariant]
runs = 64
depth = 64
fail_on_revert = false

# Network configurations
[rpc_endpoints]
arbitrum_mainnet = "${ARBITRUM_MAINNET_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
arbitrum_mainnet = { key = "${ARBISCAN_API_KEY}", url = "https://api.arbiscan.io/api" }
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }

# External library linking (populated after running DeployLibraries.s.sol)
