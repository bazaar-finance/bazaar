[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 150
dynamic_test_linking = true
solc_version = "0.8.34"
evm_version = "cancun"
remappings = [
    "@pythnetwork/pyth-sdk-solidity/=node_modules/@pythnetwork/pyth-sdk-solidity",
    "@openzeppelin/=lib/openzeppelin-contracts/",
]
# DeployLibraries.s.sol records each chain's library addresses under deployments/<chainid>/, and
# reads each library's raw artifact under out/ to resolve the link placeholders the libraries
# that call RiskParamsLib carry (vm.getCode refuses an artifact that still carries one).
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./out" },
]

# optimizer_runs is 150 for every contract. MatchingEngineLib and BazaarPair are the two
# artifacts nearest the EIP-170 ceiling, and a single global value keeps the artifact that the
# test suite and the size gate measure identical to the artifact that ships — a per-path
# restriction would compile those two differently from everything else, so a green size gate
# would say nothing about the bytecode actually deployed. The runtime cost is modest: the hot
# paths (the matching walk, liquidation, settlement) are storage-dominated, where optimizer_runs
# matters least.

# dynamic_test_linking makes test contracts resolve library addresses at deploy time inside the test
# EVM rather than at compile time. BazaarPair links eleven of the twelve external libraries that
# DeployLibraries.s.sol deploys (BazaarFactory and BazaarPairTerminator link the twelfth,
# ClaimTextLib), and most of the suite reaches BazaarPair transitively, so this is what keeps a
# one-line edit to any library body from re-running the IR pipeline over nearly the whole
# dependency graph. That is the dominant build cost: via_ir is mandatory here — BazaarPair
# exceeds the stack limit under legacy codegen — and the IR pipeline is bounded by solc's peak
# memory rather than by CPU. Deployed bytecode is byte-identical with the setting on or off, so
# ContractSizeTest still gates the artifact that ships.

[invariant]
runs = 64
# Depth is one sequence's call count, split across the handler's action menu, so it sets both how
# many times each action is attempted and how long a chain of interactions the invariants are
# checked over. Most actions here have preconditions — a position to withdraw against, an
# underwater account to seize, inventory to unload — so they need attempts to spare, not just one
# each: the liquidation regime is only reached by a move landing after a position exists. Held at
# roughly 20 calls per action; the stateful suite runs in seconds, so the headroom is cheap.
depth = 160
fail_on_revert = false

# `unsafe-typecast` fires on every explicit numeric conversion with no dataflow analysis, and src/
# converts constantly (signed PnL <-> unsigned balances, USDC <-> BAZAAR exponents, uint64 clocks).
# The convention here is that every signed->unsigned cast sits behind an explicit sign guard; the
# lint cannot see those guards, so it produces hundreds of hits and buries the rules that do find
# real defects. Silenced so a genuine warning is visible in the build output.
#
# test/ and script/ are excluded entirely: `erc20-unchecked-transfer` on a mock or a test helper
# describes no production risk, since a silently-failing transfer surfaces as a failing assertion.
[lint]
exclude_lints = ["unsafe-typecast"]
ignore = ["test/**", "script/**"]

# Network configurations
[rpc_endpoints]
arbitrum_mainnet = "${ARBITRUM_MAINNET_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

[etherscan]
arbitrum_mainnet = { key = "${ARBISCAN_API_KEY}", url = "https://api.arbiscan.io/api" }
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }

# External library linking is NOT configured here. `libraries` is a single global key with no
# per-network scoping, so one pasted list would be reused by every deploy target — linking, say, a
# rehearsal network's addresses into a production build, where they hold no code. Instead
# DeployLibraries.s.sol writes `deployments/<chainid>/libraries.args` and the deploy targets pass
# that chain's flags on the command line. See the Makefile and docs/src/guide/deployment.md.

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
